[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aqg"
version = "0.1.0"
description = "AutomatedQuestionGenerator: conference transcripts -> validated hello-bitcoin coding problems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.60"]
bedrock = ["anthropic[bedrock]>=1.13"]
gemini = ["google-genai>=0.8"]
dev = ["pytest>=7.2"]

[project.scripts]
aqg = "aqg.cli:app"

[tool.setuptools.packages.find]
include = ["aqg*"]

[tool.setuptools.package-data]
aqg = ["prompts/*.md", "sandbox/helpers/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs Docker and the hello-bitcoin-runner image",
    "postgres: needs the transcription_engine Postgres",
    "ollama: needs a running Ollama with gemma3:4b",
]
